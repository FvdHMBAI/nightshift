  </g>
  <text x="510" y="110" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">Night Shift</text>
  <text x="418" y="155" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" fill="#a78bfa" font-weight="500">Your codebase improves while you sleep</text>
  <g transform="translate(418, 200)">
