    <rect x="205" y="0" width="180" height="32" rx="16" fill="#a78bfa" opacity="0.15"/>
    <text x="295" y="21" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#a78bfa" font-weight="600" text-anchor="middle">Lint + Types + Security</text>
    <rect x="400" y="0" width="140" height="32" rx="16" fill="#a78bfa" opacity="0.15"/>
    <text x="470" y="21" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#a78bfa" font-weight="600" text-anchor="middle">Auto-Rollback</text>
